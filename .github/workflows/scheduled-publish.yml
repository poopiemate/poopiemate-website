# 예약 가이드 공개 — 매일 아침 8시 7분(KST)에 사이트를 다시 빌드해서, 올린 날(build.py GUIDE_DATES)이 된 글을 연다.
# 바뀐 게 있을 때만 커밋·푸시한다. 봇의 푸시로도 GitHub Pages 배포가 돈다(11-26 확인).
name: Scheduled publish

on:
  schedule:
    # 정각은 깃허브 예약 실행이 몰려 늦거나 빠진다(11-27 08:00 실행이 통째로 빠짐) — 몇 분 비켜 두고, 한 시간 뒤 한 번 더.
    # 바뀐 게 없으면 커밋하지 않으니 두 번 돌아도 괜찮다.
    - cron: '7 23 * * *'    # 23:07 UTC = 08:07 KST
    - cron: '17 0 * * *'    # 00:17 UTC = 09:17 KST (못 돌았을 때 대비)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"   # 저장소에 올라가 있는 .pyc가 매일 바뀌어 커밋되지 않게
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.py가 git 기록으로 글 날짜(lastmod·RSS)를 읽는다

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg   # build.py가 영상 소리 유무를 ffprobe로 본다

      - name: Build
        run: python3 src/build.py

      - name: Commit and push if anything opened today
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish today."
            exit 0
          fi
          git config user.name "poopiemate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Scheduled publish $(date +%F)"
          git push
